# DPI bypass rules configuration
rules:
  # VLESS protocol for heavily filtered sites
  - domain: "*.youtube.com"
    port: 443
    pipeline:
      vless_client:
        server: "vless.example.com"
        port: 443
        uuid: "12345678-1234-1234-1234-123456789abc"
        flow: "xtls-rprx-vision"
        encryption: "none"
        transport:
          type: "websocket"
          websocket:
            path: "/api/v1/stream"
            host: "example.com"
            headers:
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
        tls:
          min_version: "1.3"
          cipher_suites:
            - "TLS_AES_128_GCM_SHA256"
            - "TLS_AES_256_GCM_SHA384"
            - "TLS_CHACHA20_POLY1305_SHA256"
          server_name: "example.com"
        reality:
          enabled: false

  # Hysteria2 protocol for high-speed bypass
  - domain: "*.netflix.com"
    port: 443
    pipeline:
      hysteria2_client:
        server: "hysteria2.example.com"
        port: 443
        password: "hysteria2_password"
        obfuscation: "xchacha20-ietf-poly1305"
        up_mbps: 100
        down_mbps: 100

  # TUIC protocol for mobile networks
  - domain: "*.instagram.com"
    port: 443
    pipeline:
      tuic_client:
        server: "tuic.example.com"
        port: 443
        uuid: "12345678-1234-1234-1234-123456789def"
        password: "tuic_password"
        ip_version: 4
        congestion_control: "bbr"

  # Behavioral Evasion 2.0 for high DPI targets
  - domain: "*.youtube.com"
    port: 443
    pipeline:
      behavioral_evasion:
        enabled: true
        debug_mode: false
        timing_enabled: true
        timing_patterns: ["human", "mobile", "bot"]
        humanization_level: 4
        obfuscation_enabled: true
        obfuscation_level: 4
        ml_optimization: true
        fingerprinting_enabled: true
        protection_level: 4
        browser_masking: true
        adaptation_enabled: true
        adaptation_rate: 0.15
        learning_enabled: true
        timing_randomization: true
        connection_pattern: "human_like"
        jitter_range: "50-300ms"
        burst_simulation: true
        stream_simulation: true
        image_request_simulation: true
        api_simulation: true

  # Aggressive bypass for heavily filtered sites
  - domain: "*.twitter.com"
    port: 443
    pipeline:
      fragmentation:
        min_size: 64
        max_size: 128
        random: true
      headers:
        random_headers: true
        modify_host: true
        add_junk_headers: true
        custom_headers:
          "X-Forwarded-Proto": "https"
          "X-Forwarded-Host": "twitter.com"
      encryption:
        type: "xor"
        key: "twitter_bypass"
      protocol_mask:
        type: "tls"
        https_noise: true

  # Medium bypass for news sites
  - domain: "*.bbc.com"
    pipeline:
      headers:
        random_headers: true
        add_junk_headers: false
        custom_headers:
          "Accept-Language": "en-US,en;q=0.9"
      fragmentation:
        size: 256
        random: false

  # Light bypass for general sites
  - domain: "*.wikipedia.org"
    pipeline:
      headers:
        random_headers: true

  # SSH protocol masking for specific targets
  - domain: "git.example.com"
    pipeline:
      protocol_mask:
        type: "ssh"
        ssh_padding: true

  # RC4 encryption for sensitive communications
  - ip_range: "10.0.0.0/8"
    pipeline:
      encryption:
        type: "rc4"
        key: "secure_comm_key"

  # Default minimal bypass
  - domain: "*"
    pipeline:
      headers:
        random_headers: false
        modify_host: false
