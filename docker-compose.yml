version: '3.8'

services:
  socks5-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: socks5-dpi-proxy
    ports:
      - "1080:1080"
    volumes:
      - ./configs:/root/configs:ro
      - ./logs:/root/logs
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy-network:
    driver: bridge

volumes:
  logs:
    driver: local
